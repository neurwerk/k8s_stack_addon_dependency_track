name: Build and Push Dependency-Track Tooling
on:
  push:
    tags: ["tooling/v*"]
concurrency:
  group: dependency-track-tooling-release-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE_NAME: ghcr.io/neurwerk/k8s-stack-addon-dependency-track-tooling
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions: {contents: read}
  build:
    needs: quality
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate version and publish immutable image
        id: publish
        run: |
          set -eu -o pipefail
          [[ "$GITHUB_REF_NAME" =~ ^tooling/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          export VERSION="${BASH_REMATCH[1]}"
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          project = tomllib.loads(Path("tooling/pyproject.toml").read_text())
          lock = tomllib.loads(Path("tooling/uv.lock").read_text())
          locked = next(p["version"] for p in lock["package"] if p["name"] == "dependency-track-tooling")
          assert {project["project"]["version"], locked} == {os.environ["VERSION"]}
          PY
          image="$IMAGE_NAME:$VERSION"
          set +e
          manifest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' 2>&1)"
          status=$?
          set -e
          if (( status != 0 )); then
            if [[ "$manifest" != *"not found"* && "$manifest" != *"manifest unknown"* ]]; then
              echo 'Registry verification failed; refusing publication' >&2
              exit 1
            fi
            docker buildx build --platform linux/amd64 --push \
              --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
              --tag "$image" tooling
            manifest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}')"
          fi
          digest="$(jq -er '.digest' <<< "$manifest")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull --platform linux/amd64 "$IMAGE_NAME@$digest"
          docker image inspect "$IMAGE_NAME@$digest" | jq -e \
            --arg revision "$GITHUB_SHA" --arg version "$VERSION" '
              .[0] | .Os == "linux" and .Architecture == "amd64" and
              .Config.Labels["org.opencontainers.image.revision"] == $revision and
              .Config.Labels["org.opencontainers.image.version"] == $version and
              .Config.Labels["org.opencontainers.image.source"] == "https://github.com/neurwerk/k8s_stack_addon_dependency_track"
            ' > /dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
  verify-public:
    needs: build
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - name: Verify anonymous pull
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -eu -o pipefail
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          echo '{"auths":{}}' > "$DOCKER_CONFIG/config.json"
          image="$IMAGE_NAME:${GITHUB_REF_NAME#tooling/v}"
          docker pull --platform linux/amd64 "$image"
          docker image inspect "$image" | jq -e --arg expected "$IMAGE_NAME@$DIGEST" \
            '.[0] | (.RepoDigests | index($expected)) != null' > /dev/null
      - name: Report visibility gate
        if: failure()
        run: echo 'Verify package visibility and anonymous pull before adoption; never replace an existing tag.' >> "$GITHUB_STEP_SUMMARY"
