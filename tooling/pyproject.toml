[project]
name = "dependency-track-tooling"
version = "0.1.1"
description = "Dependency-Track provisioning and central SBOM collection"
requires-python = ">=3.12"
dependencies = ["k8s-stack-tooling==0.18.3"]

[tool.uv.sources]
k8s-stack-tooling = {url = "https://github.com/neurwerk/k8s_stack_tooling/releases/download/v0.18.3/k8s_stack_tooling-0.18.3-py3-none-any.whl"}

[project.scripts]
dependency-track-bootstrap = "dependency_track_tooling.bootstrap:main"
dependency-track-collect = "dependency_track_tooling.collect:main"
dependency-track-stage = "dependency_track_tooling.cli:stage"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.15.17", "ty>=0.0.49"]

[tool.ruff]
target-version = "py312"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.src]
include = ["src"]
