{{- if and .Values.dependencyTrack.enabled .Values.externalGateway.enabled }}
{{- $hostname := required "dependencyTrack.hostname is required" .Values.dependencyTrack.hostname }}
{{- range $name, $issuer := dict "staging" "letsencrypt-staging-cluster-issuer" "production" "letsencrypt-production-cluster-issuer" }}
---
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: cert-manager-dependency-track-{{ $name }}
spec:
  allowed:
    dnsNames: {values: [{{ $hostname | quote }}], required: true}
    isCA: false
    usages: [digital signature, key encipherment]
  constraints:
    minDuration: 2160h
    maxDuration: 2160h
    privateKey: {algorithm: RSA, minSize: 2048, maxSize: 2048}
  selector:
    issuerRef: {group: cert-manager.io, kind: ClusterIssuer, name: {{ $issuer | quote }}}
    namespace:
      matchNames: [{{ $.Release.Namespace | quote }}]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-dependency-track-approval-use
rules:
  - apiGroups: [policy.cert-manager.io]
    resources: [certificaterequestpolicies]
    verbs: [use]
    resourceNames: [cert-manager-dependency-track-staging, cert-manager-dependency-track-production]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-dependency-track-approval-use
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-dependency-track-approval-use
subjects:
  - {kind: ServiceAccount, name: infra-cert-manager-controller, namespace: infra-cert-manager}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dependency-track-tls
spec:
  secretName: dependency-track-tls
  duration: 2160h
  usages: [digital signature, key encipherment]
  privateKey: {algorithm: RSA, size: 2048, rotationPolicy: Always}
  dnsNames: [{{ $hostname | quote }}]
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ ternary "letsencrypt-production-cluster-issuer" "letsencrypt-staging-cluster-issuer" .Values.publicCertificates.useProduction }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dependency-track-gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      port: {{ .Values.externalGateway.port }}
      protocol: HTTPS
      hostname: {{ $hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs: [{name: dependency-track-tls, kind: Secret, group: ""}]
      allowedRoutes:
        namespaces: {from: Same}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dependency-track
spec:
  parentRefs: [{name: dependency-track-gateway, sectionName: websecure}]
  hostnames: [{{ $hostname | quote }}]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api}
      backendRefs: [{name: dependency-track-api, port: 8080}]
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs: [{name: dependency-track-frontend, port: 8080}]
{{- end }}
