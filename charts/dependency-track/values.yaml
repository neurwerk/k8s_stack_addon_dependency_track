dependencyTrack:
  enabled: false
  hostname: ""
  apiImage: ghcr.io/dependencytrack/apiserver:5.2.2@sha256:cd5bed12ff30fd36980dbee2d6c3b177c37b99c63b60f5a5b15fbca0b31d0f38
  frontendImage: ghcr.io/dependencytrack/frontend:5.2.2@sha256:fd15b6cdc38692518a703eab0ed2867fa34e1276034cbe00773c61a9975cf719
  # Candidate only; replace with verified full version and digest before adoption.
  toolingImage: ghcr.io/neurwerk/k8s-stack-addon-dependency-track-tooling:0.1.0
  database:
    url: jdbc:postgresql://postgres-operations.infra-postgres-operations.svc:5432/dependency_track?reWriteBatchedInserts=true
    user: dependency_track
    secret: dependency-track-database
    passwordKey: dbPassword
  runtimeSecret: dependency-track-runtime
  adminSecret: dependency-track-admin
  collectorSecret: dependency-track-collector
  persistence:
    storageClass: infra-rook-ceph-rbd
    size: 10Gi
  apiResources:
    requests: {cpu: 200m, memory: 2Gi}
    limits: {cpu: "4", memory: 4Gi}
  frontendResources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: "1", memory: 256Mi}
  bootstrapResources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: "1", memory: 256Mi}
  networkPolicy:
    postgresPodPort: 9712
    postgresPodSelector:
      app.kubernetes.io/name: postgres-operations
  collection:
    enabled: false
    schedule: "17 * * * *"
    discoverRunningImages: false
    # Required for discovery: actual API endpoint IPs, not workstation forwarding.
    kubernetesApiCidrs: []
    kubernetesApiPort: 6443
    repositories: []
    # Explicit images require immutable registry references ending in @sha256:...
    images: []
    githubSecret: ""
    registrySecret: ""
    syftImage: ghcr.io/anchore/syft:v1.57.2-debug@sha256:f0368b2eb2177250966df45efbd34aa6e9809539ebd391e99eb3bed448564ebb
    cdxgenImage: ghcr.io/cyclonedx/cdxgen:13.3.0@sha256:0e2eef6dbc92a91d037531e7e3d8190f396d84d7bf0c1029807fbdebcb53a4c8
    stateSize: 1Gi
    workSize: 10Gi
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: "2", memory: 4Gi}
